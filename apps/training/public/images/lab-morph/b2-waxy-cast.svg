<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#eef6fb"/>
  <!-- 背景碎屑 -->
  <g fill="#d8cfbd" opacity="0.8">
    <circle cx="90" cy="90" r="6"/><circle cx="120" cy="300" r="5"/><circle cx="545" cy="90" r="6"/>
    <circle cx="570" cy="300" r="7"/><circle cx="70" cy="210" r="4"/>
  </g>

  <!-- 宽大蜡样管型 -->
  <rect x="165" y="60" width="220" height="285" rx="26" fill="#efe6d2" stroke="#c4b491" stroke-width="4"/>
  <rect x="180" y="75" width="190" height="255" rx="18" fill="#f6efdF" stroke="#d6caae" stroke-width="1.5"/>

  <!-- 均质纹理与切迹 -->
  <g stroke="#cdbd9c" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M200 100 L200 300"/>
    <path d="M230 92 Q240 180 232 288"/>
    <path d="M280 86 Q272 180 284 296"/>
    <path d="M330 92 Q340 176 332 292"/>
    <path d="M360 110 L358 286"/>
    <!-- 切迹 -->
    <path d="M186 160 L206 152 L196 176"/>
    <path d="M348 210 L372 202 L360 230"/>
  </g>

  <!-- 第二段破碎管型 -->
  <g>
    <rect x="465" y="140" width="105" height="120" rx="18" fill="#efe6d2" stroke="#c4b491" stroke-width="3.5"/>
    <path d="M490 168 Q520 200 488 232" stroke="#cdbd9c" stroke-width="2.5" fill="none"/>
    <path d="M535 180 Q548 210 538 238" stroke="#cdbd9c" stroke-width="2.5" fill="none"/>
  </g>

  <path d="M150 88 Q150 60 180 60 M400 88 Q400 60 370 60" fill="none" stroke="#6aa3c9" stroke-width="2" stroke-dasharray="6 5"/>
</svg>
